     <script>

     setInterval(showTime, 1000);
     function showTime() {
        const d = new date();
        document.getElementById("clock").innerHTML =
        d.getHours() + ":" + d.getMinute() + ":" + d,getSeconds();
     } 


       function displayDate(){
        document.getElementById("demo1").innerHTML = Date();
       } 

       function darkMode() {
    document.body.classList.toggle("bg-dark");
    document.body.classList.toggle("text-white");}

    let clicks = 0;

function countClicks() {
    clicks++;
    document.getElementById("count").innerHTML = clicks;}

    let clicks1 = 1;
    function countClicks1() {
        clicks1--;
        document.getElementById("count1").innerHTML = clicks1;
    }

    function increaseFont() {
    document.getElementById("font").style.fontSize = "40px";}

    function turnOn() {
    document.getElementById("bulb").src = "images/IMG_0175.JPG";
}

function turnOff() {
    document.getElementById("bulb").src = "images/IMG_0174.JPG";
}

    </script>
